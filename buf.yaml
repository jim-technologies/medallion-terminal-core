version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Get/Stream intentionally share DataRequest/DataResponse — the
    # whole-point of the design is one request type, one response type.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
