# pnpm 11+ reads build-script allowlists from here (it no longer honors the
# `pnpm.onlyBuiltDependencies` field in package.json). esbuild fetches its
# native binary via a postinstall build; allowing it lets this package build
# its dist/ bundle.
allowBuilds:
  esbuild: true
# pnpm 11 enforces its one-day minimumReleaseAge on every install, the
# gate's `--frozen-lockfile` install included: it re-verifies each lockfile
# entry's publish time. The 2026-09-25 currency round selected these two
# releases (published 2026-09-24), so until 2026-09-25T12:46:30Z the gate's
# install fails without them. After that they are dead config; the next
# currency round deletes them.
minimumReleaseAgeExclude:
  - maplibre-gl@6.11.2
  - vite@8.3.1
