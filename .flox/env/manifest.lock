    "hook": {
      "on-activate": "  for browser_schema_dir in \"$FLOX_ENV\"/share/gsettings-schemas/gsettings-desktop-schemas-*/glib-2.0/schemas; do\n    if test -f \"$browser_schema_dir/gschemas.compiled\"; then\n      export GSETTINGS_SCHEMA_DIR=\"$browser_schema_dir\"\n      break\n    fi\n  done\n  mkdir -p \"$FLOX_ENV_CACHE/fontconfig/cache\"\n  cat > \"$FLOX_ENV_CACHE/fontconfig/fonts.conf\" <<EOF\n<?xml version=\"1.0\"?>\n<!DOCTYPE fontconfig SYSTEM \"fonts.dtd\">\n<fontconfig>\n  <dir>$FLOX_ENV/share/fonts</dir>\n  <cachedir>$FLOX_ENV_CACHE/fontconfig/cache</cachedir>\n  <match target=\"font\">\n    <edit name=\"antialias\" mode=\"assign\"><bool>true</bool></edit>\n    <edit name=\"hinting\" mode=\"assign\"><bool>true</bool></edit>\n    <edit name=\"hintstyle\" mode=\"assign\"><const>hintslight</const></edit>\n    <edit name=\"rgba\" mode=\"assign\"><const>none</const></edit>\n    <edit name=\"embeddedbitmap\" mode=\"assign\"><bool>false</bool></edit>\n  </match>\n  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>\n  <alias><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>\n  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>\n  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>\n</fontconfig>\nEOF\n  export FONTCONFIG_FILE=\"$FLOX_ENV_CACHE/fontconfig/fonts.conf\"\n"
    },
    "profile": {},
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
