## Flox Environment Manifest -----------------------------------------
##
##   _Everything_ you need to know about the _manifest_ is here:
##
##   https://flox.dev/docs/reference/command-reference/manifest.toml/
##
## -------------------------------------------------------------------
# Flox manifest version managed by Flox CLI
version = 1


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
nodejs.pkg-path = "nodejs"
pnpm.pkg-path = "pnpm"
buf.pkg-path = "buf"
actionlint.pkg-path = "actionlint"
lato.pkg-path = "lato"
dejavu_fonts.pkg-path = "dejavu_fonts"
noto-fonts-color-emoji.pkg-path = "noto-fonts-color-emoji"
inter.pkg-path = "inter"
# gum.pkg-path = "gum"
# gum.version = "^0.14.5"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"


## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
# Pin font rendering to the fonts this environment provides so browser-test
# screenshots rasterize identically on every machine, including CI. Without
# this, chromium falls back to whatever the host has installed and the visual
# baselines drift between machines.
on-activate = '''
  mkdir -p "$FLOX_ENV_CACHE/fontconfig/cache"
  cat > "$FLOX_ENV_CACHE/fontconfig/fonts.conf" <<EOF
<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>$FLOX_ENV/share/fonts</dir>
  <cachedir>$FLOX_ENV_CACHE/fontconfig/cache</cachedir>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>
</fontconfig>
EOF
  export FONTCONFIG_FILE="$FLOX_ENV_CACHE/fontconfig/fonts.conf"
'''


