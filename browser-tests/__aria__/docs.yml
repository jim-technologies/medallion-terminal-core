- article "Q3 operating plan":
  - text: FY26 · Strategy & operations
  - heading "Q3 Operating Plan" [level=1]
  - paragraph: A focused plan for durable growth, customer trust, and operating leverage.
  - text: Jun July 17, 2026 On track
  - heading "Executive summary" [level=2]
  - paragraph: Q3 is about converting strong product momentum into repeatable customer outcomes. We will concentrate investment in the workflows that make small teams measurably faster, while preserving the reliability and trust expected from critical business software.
  - strong: Q3 focus
  - paragraph: Make connected workflows the fastest path from raw data to a confident business decision.
  - heading "Company priorities" [level=2]
  - list:
    - listitem: Ship the unified workspace beta to 50 design partners.
    - listitem: Increase activation from first data connection to a live workflow.
    - listitem: Establish weekly operating reviews with a single source of truth.
  - heading "Operating principles" [level=2]
  - paragraph: Default to clarity. Every initiative has one owner, one measurable outcome, and an explicit decision date. Teams can move independently when interfaces and expectations are clear.
  - text: Maya
