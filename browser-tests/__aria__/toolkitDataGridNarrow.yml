- main:
  - text: Toolkit · Workbench
  - heading "Narrow columns" [level=1]
  - paragraph: "A dense ARIA grid: one tab stop, arrow keys, Space to select, Shift for ranges, Enter to open, the Menu key for row actions. Headers sort and resize; above 200 rows only the rows in view render."
  - region "Narrow columns component example":
    - grid "Documents":
      - rowgroup:
        - row "Document Path Note Size":
          - columnheader "Document"
          - columnheader "Path"
          - columnheader "Note"
          - columnheader "Size"
      - rowgroup:
        - row "quarterly-board-review-final.pdf finance/board/2026/q3/quarterly-board-review-final.pdf Signed by the audit committee 2.4 MB":
          - gridcell "quarterly-board-review-final.pdf"
          - gridcell "finance/board/2026/q3/quarterly-board-review-final.pdf":
            - code: finance/board/2026/q3/quarterly-board-review-final.pdf
          - gridcell "Signed by the audit committee"
          - gridcell "2.4 MB"
        - row "northstar-master-agreement.pdf legal/contracts/northstar/master-agreement.pdf Renewal terms under review 812 kB":
          - gridcell "northstar-master-agreement.pdf"
          - gridcell "legal/contracts/northstar/master-agreement.pdf":
            - code: legal/contracts/northstar/master-agreement.pdf
          - gridcell "Renewal terms under review"
          - gridcell "812 kB"
        - row "crm-field-mapping.json integrations/crm/field-mapping.json Generated by the CRM sync 9.8 kB":
          - gridcell "crm-field-mapping.json"
          - gridcell "integrations/crm/field-mapping.json":
            - code: integrations/crm/field-mapping.json
          - gridcell "Generated by the CRM sync"
          - gridcell "9.8 kB"
    - grid "Set widths":
      - rowgroup:
        - row "Amount Updated Status Tags Owner Shared":
          - columnheader "Amount"
          - columnheader "Updated"
          - columnheader "Status"
          - columnheader "Tags"
          - columnheader "Owner"
          - columnheader "Shared"
      - rowgroup:
        - row "$1,284,500.25 Sep 24, 2026, 2:02 AM Near quota Finance Board +1 Naomie Park Yes":
          - gridcell "$1,284,500.25"
          - gridcell "Sep 24, 2026, 2:02 AM":
            - time: Sep 24, 2026, 2:02 AM
          - gridcell "Near quota"
          - gridcell "Finance Board +1"
          - gridcell "Naomie Park":
            - link "Naomie Park":
              - /url: "#/objects/per-naomie-park"
          - gridcell "Yes"
        - row "$98,400.00 Sep 21, 2026, 9:40 PM Available Legal Daniel Reyes No":
          - gridcell "$98,400.00"
          - gridcell "Sep 21, 2026, 9:40 PM":
            - time: Sep 21, 2026, 9:40 PM
          - gridcell "Available"
          - gridcell "Legal"
          - gridcell "Daniel Reyes":
            - link "Daniel Reyes":
              - /url: "#/objects/per-daniel-reyes"
          - gridcell "No"
        - row "$2,150.50 Aug 27, 2026, 8:00 PM Read-only Sync CRM Ada Morgan Yes":
          - gridcell "$2,150.50"
          - gridcell "Aug 27, 2026, 8:00 PM":
            - time: Aug 27, 2026, 8:00 PM
          - gridcell "Read-only"
          - gridcell "Sync CRM"
          - gridcell "Ada Morgan":
            - link "Ada Morgan":
              - /url: "#/objects/per-ada-morgan"
