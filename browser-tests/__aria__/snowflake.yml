  - list:
    - listitem: WITH account_usage AS (
    - listitem: SELECT account_id,
    - listitem: COUNT(DISTINCT user_id) AS active_users,
    - listitem: MAX(event_at) AS last_active_at
    - listitem: FROM PRODUCT.CURATED.USAGE_EVENTS
    - listitem: WHERE event_at >= DATEADD(day, -30, CURRENT_DATE)
    - listitem: GROUP BY 1
    - listitem: )
    - listitem: SELECT c.account_name, c.segment, c.arr,
    - listitem: c.health_score, u.last_active_at
    - listitem: FROM ANALYTICS.GOLD.CUSTOMER_360 c
    - listitem: JOIN account_usage u USING (account_id)
    - listitem: ORDER BY c.arr DESC;
