- main:
  - text: Toolkit · Files
  - heading "CodeView" [level=1]
  - paragraph: "Bounded, safe previews: text read at most 1 MB, CSV at most 1,000 × 100 into a windowed grid, images and PDFs only with a valid signature, HTML and SVG never rendered, Markdown sanitised."
  - region "CodeView component example":
    - text: TypeScript 18 lines
    - checkbox "Wrap lines"
    - text: Wrap lines
    - button "Copy code"
    - status
    - code: "import { DataGrid } from 'medallion-terminal-core/toolkit' interface Customer { id: string name: string acv: number } export function Customers({ rows }: { rows: Customer[] }) { return ( <DataGrid label=\"Customers\" columns={[{ id: 'name', header: 'Customer' }, { id: 'acv', header: 'ACV', format: 'currency:USD' }]} rows={rows} rowKey={row => row.id} /> ) }"
  - text: Theme and density inherit from the scoped toolkit root.