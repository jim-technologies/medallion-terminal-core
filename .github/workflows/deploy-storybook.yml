# Documentation deployment: the static Storybook catalog to GitHub Pages.
# Uses only the ephemeral job token (OIDC id-token) — no stored secrets, and
# the only non-gate command is the same Flox-routed `make` grammar CI uses.
name: deploy-storybook
"on":
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1 # v2.6.0
        with:
          disable-metrics: "true"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/flox
          key: flox-${{ runner.os }}-${{ hashFiles('.flox/env/manifest.lock') }}
      - name: Build the Storybook catalog
        env:
          FLOX_DISABLE_METRICS: "true"
        run: flox activate -- make build-storybook
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
