name: ci
"on":
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # `make validate` runs `buf breaking --against '.git#branch=origin/main'`,
          # which needs real history, not a shallow single-ref clone.
          fetch-depth: 0
      - uses: flox/install-flox-action@1128abd73431089ab9d871c893b4e72a729354e1 # v2.6.0
        with:
          disable-metrics: "true"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/flox
          key: flox-${{ runner.os }}-${{ hashFiles('.flox/env/manifest.lock') }}
      - name: Run the gate
        env:
          FLOX_DISABLE_METRICS: "true"
        run: flox activate -- make validate
